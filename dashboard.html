<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        body { font-family: Arial; margin: 0; padding: 0; }
        .navbar {
            background-color: #003366;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }
        .container {
            display: flex;
            min-height: 500px;
        }
        .sidebar {
            width: 250px;
            background: white;
            border-right: 1px solid #ddd;
            padding: 20px;
        }
        .main {
            flex: 1;
            padding: 20px;
        }
        .folder-item, .file-item {
            padding: 8px;
            cursor: pointer;
        }
        .folder-item:before { content: "📁 "; }
        .file-item:before { content: "📄 "; }
        .breadcrumb { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="navbar">
        <span>Portfolio Operations System</span>
        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <h3>Folders</h3>
            <div class="folder-item" onclick="navigateTo('GTA')">GTA</div>
            <div class="folder-item" onclick="navigateTo('VAT')">VAT</div>
            <div class="folder-item" onclick="navigateTo('BAT')">BAT</div>
        </div>
        <div class="main">
            <div class="breadcrumb" id="breadcrumb">Home</div>
            <div id="fileList"></div>
        </div>
    </div>

    <script>
        function navigateTo(folder) {
            document.getElementById('breadcrumb').innerHTML = folder;
            let files = '';
            if (folder === 'GTA') {
                files = '<div class="file-item" onclick="openFile()">Contract.pdf</div>';
            } else if (folder === 'VAT') {
                files = '<div class="file-item" onclick="openFile()">Agreement.pdf</div>';
            } else if (folder === 'BAT') {
                files = '<div class="file-item" onclick="openFile()">Report.pdf</div>';
            }
            document.getElementById('fileList').innerHTML = files;
        }

        function openFile() {
            let pwd = prompt('Enter password:');
            if (pwd === 'demo') {
                alert('Access granted');
            } else {
                alert('Wrong password');
            }
        }

        function logout() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
