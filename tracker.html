<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker – Portfolio Ops</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7fc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            background: linear-gradient(135deg, #003366 0%, #004080 100%);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar-brand {
            font-size: 1.4rem;
            font-weight: bold;
        }
        .navbar-menu {
            display: flex;
            align-items: center;
            gap: 25px;
        }
        .navbar-menu a {
            color: white;
            text-decoration: none;
            padding: 5px 10px;
        }
        .navbar-menu a:hover {
            background-color: rgba(255,255,255,0.1);
            border-radius: 4px;
        }
        .user-info {
            background-color: #ffcc00;
            color: #003366;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: bold;
        }
        .tools-bar {
            background-color: #e9ecef;
            padding: 12px 30px;
            display: flex;
            gap: 30px;
            border-bottom: 1px solid #dee2e6;
            flex-wrap: wrap;
        }
        .tools-bar span {
            font-weight: bold;
            color: #003366;
        }
        .tools-bar a {
            color: #0056b3;
            text-decoration: none;
        }
        .container {
            padding: 30px;
            flex: 1;
        }
        h2 {
            color: #003366;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        th {
            background-color: #003366;
            color: white;
            padding: 15px 10px;
            text-align: left;
        }
        td {
            padding: 12px 10px;
            border-bottom: 1px solid #dee2e6;
        }
        tr:hover {
            background-color: #f8f9fa;
        }
        .priority-high { color: #dc3545; font-weight: bold; }
        .priority-medium { color: #ffc107; font-weight: bold; }
        .priority-low { color: #28a745; font-weight: bold; }
        .footer {
            background-color: #003366;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="navbar-brand">📁 Portfolio Operations System</div>
        <div class="navbar-menu">
            <span class="user-info" id="userDisplay">👤 </span>
            <a href="dashboard.html">Dashboard</a>
            <a href="register.html">Document Register</a>
            <a href="tracker.html">Task Tracker</a>
            <a href="ai-workflow.html">AI Workflows</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </div>

    <div class="tools-bar">
        <span>Connected Tools:</span>
        <a href="#">GTA Global Connect</a>
        <a href="#">Maximize for Life</a>
        <a href="#">Monday</a>
        <a href="#">Jonyo</a>
    </div>

    <div class="container">
        <h2>✅ Portfolio Task Tracker</h2>
        <table>
            <thead>
                <tr>
                    <th>Company</th>
                    <th>Task</th>
                    <th>Category</th>
                    <th>Owner</th>
                    <th>Deadline</th>
                    <th>Priority</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="taskTable"></tbody>
        </table>
    </div>

    <div class="footer">
        Portfolio Document Control & Operations System – Demo
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('user') || 'admin';
        document.getElementById('userDisplay').innerHTML = '👤 ' + username;

        const users = {
            admin: { companies: ['GTA', 'VAT', 'BAT'] },
            legal: { companies: ['GTA', 'VAT', 'BAT'] },
            support: { companies: ['GTA', 'BAT'] }
        };
        const user = users[username] || users.admin;

        const allTasks = [
            { company: 'GTA', task: 'Annual Compliance Filing', category: 'Compliance', owner: 'Legal Team', deadline: '2026-06-30', priority: 'High', status: 'Pending' },
            { company: 'GTA', task: 'Board Meeting Prep', category: 'Governance', owner: 'Executive', deadline: '2026-04-10', priority: 'Medium', status: 'In Progress' },
            { company: 'VAT', task: 'Contract Renewal', category: 'Legal', owner: 'Ops Manager', deadline: '2026-04-15', priority: 'Medium', status: 'In Progress' },
            { company: 'VAT', task: 'Update Shareholder Register', category: 'Corporate', owner: 'Legal Team', deadline: '2026-03-25', priority: 'Low', status: 'Not Started' },
            { company: 'BAT', task: 'Q2 Investor Report', category: 'Reporting', owner: 'Finance', deadline: '2026-07-15', priority: 'High', status: 'Pending' },
            { company: 'BAT', task: 'Support Ticket Review', category: 'Operations', owner: 'Support Team', deadline: '2026-03-30', priority: 'Medium', status: 'In Progress' }
        ];

        const filteredTasks = allTasks.filter(task => user.companies.includes(task.company));
        const tbody = document.getElementById('taskTable');
        
        filteredTasks.forEach(task => {
            const row = tbody.insertRow();
            let priorityClass = '';
            if (task.priority === 'High') priorityClass = 'priority-high';
            else if (task.priority === 'Medium') priorityClass = 'priority-medium';
            else if (task.priority === 'Low') priorityClass = 'priority-low';
            
            row.innerHTML = `
                <td>${task.company}</td>
                <td>${task.task}</td>
                <td>${task.category}</td>
                <td>${task.owner}</td>
                <td>${task.deadline}</td>
                <td class="${priorityClass}">${task.priority}</td>
                <td>${task.status}</td>
            `;
        });

        function logout() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
