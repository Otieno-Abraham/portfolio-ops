<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Operations System | Secure Access</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        /* Subtle background image with overlay */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            opacity: 0.15;
            pointer-events: none;
        }
        
        .login-container {
            width: 440px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 48px 40px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .login-header h2 {
            color: #1a1f36;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        
        .login-header p {
            color: #5b6e8c;
            font-size: 15px;
            font-weight: 400;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            text-align: left;
            color: #1a1f36;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e6e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s ease;
            background: #ffffff;
        }
        
        .input-group input:focus {
            border-color: #4f46e5;
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        .input-group input::placeholder {
            color: #a0a8bd;
            font-size: 14px;
        }
        
        .login-btn {
            width: 100%;
            padding: 16px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 24px 0 20px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        
        .login-btn:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
        }
        
        .login-footer {
            text-align: center;
            color: #5b6e8c;
            font-size: 14px;
            padding-top: 20px;
            border-top: 1px solid #e6e8f0;
        }
        
        .login-footer p {
            margin: 4px 0;
        }
        
        .role-hint {
            background: #f8fafd;
            padding: 16px;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid #e6e8f0;
        }
        
        .role-hint p {
            color: #1a1f36;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .role-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #5b6e8c;
            font-size: 13px;
            margin: 6px 0;
        }
        
        .role-dot {
            width: 6px;
            height: 6px;
            background: #4f46e5;
            border-radius: 50%;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>Portfolio Operations</h2>
            <p>Document Control System</p>
        </div>
        
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter your username" value="admin" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="login-btn">Access System →</button>
        </form>
        
        <div class="role-hint">
            <p>System Access Levels</p>
            <div class="role-item"><span class="role-dot"></span> Administrator (Full access)</div>
            <div class="role-item"><span class="role-dot"></span> Legal Team (Legal folders)</div>
            <div class="role-item"><span class="role-dot"></span> Support Team (GTA & BAT only)</div>
        </div>
        
        <div class="login-footer">
            <p>Secure Portfolio Management System</p>
            <p style="font-size: 12px; margin-top: 8px;">© 2026 Portfolio Operations</p>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if ((username === 'admin' && password === 'admin') ||
                (username === 'legal' && password === 'legal') ||
                (username === 'support' && password === 'support')) {
                window.location.href = 'dashboard.html?user=' + username;
            } else {
                alert('Invalid username or password');
            }
            return false;
        }
    </script>
</body>
</html>
