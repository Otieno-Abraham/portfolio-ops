<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Ops – Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            max-width: 450px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,51,102,0.15);
            text-align: center;
        }
        .login-container h2 {
            color: #003366;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .login-container input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }
        .login-container input:focus {
            border-color: #0056b3;
            outline: none;
        }
        .login-container button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }
        .login-container button:hover {
            background-color: #003d82;
        }
        .user-list {
            text-align: left;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #0056b3;
            font-size: 14px;
        }
        .user-list strong {
            color: #003366;
            font-size: 16px;
            display: block;
            margin-bottom: 10px;
        }
        .user-list span {
            color: #0056b3;
            font-weight: bold;
            display: inline-block;
            width: 70px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Portfolio Operations & Document Control</h2>
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <input type="text" id="username" placeholder="Username" value="admin" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        
        <div class="user-list">
            <strong>Demo Credentials:</strong><br><br>
            <span>admin</span> / admin (Full access - all companies & folders)<br>
            <span>legal</span> / legal (Legal team - legal folders only)<br>
            <span>support</span> / support (Support team - GTA & BAT only)
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if ((username === 'admin' && password === 'admin') ||
                (username === 'legal' && password === 'legal') ||
                (username === 'support' && password === 'support')) {
                window.location.href = 'dashboard.html?user=' + username;
            } else {
                alert('Invalid username or password');
            }
            return false;
        }
    </script>
</body>
</html>
